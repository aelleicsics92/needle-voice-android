name: Build Needle Voice APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q NeedleVoice-CloudBuild.zip -d extracted
          test -f extracted/NeedleVoice/settings.gradle.kts

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          path = "extracted/NeedleVoice/app/build.gradle.kts"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          old = "    defaultConfig {"
          new = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              defaultConfig {"""
          if old not in content:
              raise SystemExit("Non trovo defaultConfig nel file Gradle")
          content = content.replace(old, new, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p extracted/NeedleVoice assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NeedleVoice-debug-apk
          path: extracted/NeedleVoice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
