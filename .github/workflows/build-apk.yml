name: Build Needle Voice APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, needle-v1 ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NeedleVoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Pubblica release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "Needle-$TAG.apk"
          gh release create "$TAG" "Needle-$TAG.apk" --title "Needle $TAG" --notes "APK debug (installabile)" --target "$GITHUB_SHA" --latest
